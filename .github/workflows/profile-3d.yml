# 3D 贡献城市：把贡献图渲染成 3D 等距 SVG，直接提交进仓库主分支。
# 产物在 profile-3d-contrib/ 目录下，共 9 种风格，README 里用的是 profile-green-animate.svg。
# 想换风格改 README 里的文件名即可：
#   profile-green-animate / profile-season-animate / profile-night-view /
#   profile-night-green / profile-night-rainbow / profile-gitblock 等
name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *" # 每天 UTC 18:00（北京凌晨 2 点）
  workflow_dispatch:
  push:
    branches: [main] # 推送即自动生成，首跑不用手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "generated"; then
            git push
          fi
