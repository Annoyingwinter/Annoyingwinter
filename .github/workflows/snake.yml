# 贪吃蛇：每天自动抓取真实贡献图，生成"蛇吃绿格子"动画 SVG。
# 产物推送到本仓库的 output 分支（不动 main 分支），README 用 raw 链接引用。
# 改蛇的颜色：在 outputs 文件名后加参数，例如
#   dist/github-snake.svg?color_snake=purple
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # 每天零点（UTC）
  workflow_dispatch: # 允许在 Actions 页面手动触发
  push:
    branches: [main]

permissions:
  contents: write # 允许往 output 分支推文件

concurrency:
  group: snake
  cancel-in-progress: true # 连续触发时只跑最新一次，防止抢分支

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
